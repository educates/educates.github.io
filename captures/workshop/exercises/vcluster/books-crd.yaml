apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: books.bookshelf.example.com
spec:
  group: bookshelf.example.com
  scope: Namespaced
  names:
    kind: Book
    plural: books
    singular: book
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              title:
                type: string
              author:
                type: string
