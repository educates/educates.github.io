# Serves the built site the way GitHub Pages serves it, so the `serve` image
# previews the URLs the live site has (docs/adr/0002-keep-the-docusaurus-url-form.md):
#
# - `/page` serves the file `page`, else `page.html`.
# - A URL ending in `/` serves its directory's `index.html` or is a 404, so
#   `/page/` is a 404 even when `page.html` exists.
# - A directory URL without the `/` redirects to add it.
# - Anything else is a 404 with the site's `404.html`.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    charset utf-8;

    # A relative Location keeps the host and port the browser used.
    absolute_redirect off;

    error_page 404 /404.html;

    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The feeds, the sitemap and the feed stylesheets, as GitHub Pages types
    # them; a browser applies a feed's XSL stylesheet only when it is XML.
    location ~ \.(xml|xsl)$ {
        types { }
        default_type application/xml;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;
}
