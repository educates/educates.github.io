# Workshops on the Educates Hub that the site's pages link to. A page names a
# workshop by its id, the key below, and never writes a Hub URL into its
# copy; naming an id this file does not define fails the build.
#
# The id is the workshop's slug on the Hub, the title is the Hub's own, and
# the URL is its page on hub.educates.dev, with the trailing slash the Hub
# serves. The Hub's catalog is educates/educates-hub.github.io,
# src/content/workshops/.

lab-kubernetes-fundamentals:
  title: Kubernetes Fundamentals
  url: https://hub.educates.dev/lab-kubernetes-fundamentals/

lab-workshop-session:
  title: Educates Workshop Session Walkthrough
  url: https://hub.educates.dev/lab-workshop-session/

lab-slide-presentations:
