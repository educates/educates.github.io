name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment finishes before the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Node.js version from the Volta pin
        id: node
        run: echo "version=$(jq -r .volta.node package.json)" >> "$GITHUB_OUTPUT"

      # Installs the dependencies, runs `npm run build` (the build and the
      # site check) and uploads dist/ as the Pages artifact.
      - name: Build the site and upload it
        uses: withastro/action@v6
        with:
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
